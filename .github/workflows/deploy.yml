name: Deploy static site

# Автоматическая сборка и публикация статического сайта на GitHub Pages.
# Файл размещается по пути .github/workflows/deploy.yml

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Права, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать несколько публикаций одновременно
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Индивидуальный проект: проверка качества HTML/CSS перед деплоем
  validate:
    name: Validate HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check site structure
        run: python scripts/check_site.py

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
